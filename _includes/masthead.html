{% include base_path %}
<div class="masthead">
  <div class="masthead__inner-wrap">
    <nav class="academic-nav" aria-label="Main navigation">
      <a class="academic-nav__brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <button class="academic-nav__toggle" aria-expanded="false" aria-controls="academic-nav-links" aria-label="Open navigation menu">Menu <span aria-hidden="true">☰</span></button>
      <div class="academic-nav__links" id="academic-nav-links">
        {% for link in site.data.navigation.main %}
          <a href="{{ link.url | relative_url }}"{% if page.url contains link.url and link.url != '/' %} aria-current="page"{% endif %}>{{ link.title }}</a>
        {% endfor %}
      </div>
      <button class="academic-nav__theme" aria-label="Toggle color theme"><span aria-hidden="true">◐</span></button>
    </nav>
  </div>
</div>
