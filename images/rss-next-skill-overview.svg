<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Which hand will learn the next skill?</title>
  <desc id="desc">Three consecutive views explain a support exchange. Two green fingers keep holding the same object while the same three-link orange finger releases, moves above the object, and touches a new location. Contact observations inform hand selection, followed by fresh controller training on new skills. Concept schematic, not experimental results.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="m1 1 4 2.5L1 6" fill="none" stroke="#a5d4c3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="move" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="m1 1 4 2.5L1 6" fill="none" stroke="#efbd71" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <g id="held-object">
      <rect x="-64" y="44" width="116" height="16" rx="8" fill="#38525a"/>
      <rect x="-28" y="-28" width="56" height="56" rx="8" fill="#f3f1e9"/>
      <path d="M-36 48-51 29-25 19M36 48 51 29 25 19" fill="none" stroke="#89c6b1" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="#223c45" stroke="#89c6b1" stroke-width="2"><circle cx="-51" cy="29" r="4"/><circle cx="51" cy="29" r="4"/></g>
      <g fill="#89c6b1" stroke="#172831" stroke-width="2"><circle cx="-25" cy="19" r="6"/><circle cx="25" cy="19" r="6"/></g>
    </g>
    <path id="proximal-link" d="M0 0H73" stroke="#efbd71" stroke-width="9" stroke-linecap="round"/>
    <path id="middle-link" d="M0 0H71" stroke="#efbd71" stroke-width="9" stroke-linecap="round"/>
    <path id="distal-link" d="M0 0H35" stroke="#efbd71" stroke-width="9" stroke-linecap="round"/>
    <circle id="finger-joint" r="5" fill="#223c45" stroke="#efbd71" stroke-width="2"/>
    <circle id="fingertip" r="5" fill="#efbd71" stroke="#172831" stroke-width="1.5"/>
  </defs>
  <rect width="960" height="540" fill="#172831"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="42" fill="#a5d4c3" font-size="14" letter-spacing="2.5">DEXTEROUS MANIPULATION / RSS 2027</text>
    <text x="48" y="86" fill="#fffefa" font-size="34">Which hand will learn the next skill?</text>
    <text x="48" y="119" fill="#c1cfce" font-size="18">Can familiar contact behavior help us choose a hand?</text>

    <rect x="48" y="148" width="864" height="243" rx="14" fill="#223c45" stroke="#45605e"/>
    <text x="70" y="178" fill="#a5d4c3" font-size="14" letter-spacing="1">01 / WATCH HOW FINGERS CHANGE CONTACT</text>
    <text x="198" y="214" text-anchor="middle" fill="#fffefa" font-size="18">Release</text>
    <text x="480" y="214" text-anchor="middle" fill="#fffefa" font-size="18">Reposition</text>
    <text x="762" y="214" text-anchor="middle" fill="#fffefa" font-size="18">Recontact</text>

    <g transform="translate(198 283)">
      <use href="#held-object"/>
      <g transform="translate(-52 49) rotate(-125.55)">
        <use href="#proximal-link"/>
        <g transform="translate(73 0) rotate(77.13)">
          <use href="#middle-link"/>
          <g transform="translate(71 0) rotate(78.42)">
            <use href="#distal-link"/>
            <use href="#fingertip" x="35"/>
            <use href="#finger-joint"/>
          </g>
          <use href="#finger-joint"/>
        </g>
        <use href="#finger-joint"/>
      </g>
      <circle cx="-18" cy="-28" r="5" fill="none" stroke="#efbd71" stroke-width="2" stroke-dasharray="3 2"/>
      <path d="M-8-33-8-47" fill="none" stroke="#efbd71" stroke-width="2" marker-end="url(#move)"/>
    </g>
    <g transform="translate(480 283)">
      <use href="#held-object"/>
      <g transform="translate(-52 49) rotate(-105)">
        <use href="#proximal-link"/>
        <g transform="translate(73 0) rotate(75.14)">
          <use href="#middle-link"/>
          <g transform="translate(71 0) rotate(41.17)">
            <use href="#distal-link"/>
            <use href="#fingertip" x="35"/>
            <use href="#finger-joint"/>
          </g>
          <use href="#finger-joint"/>
        </g>
        <use href="#finger-joint"/>
      </g>
      <path d="M-8-63Q12-69 36-55" fill="none" stroke="#efbd71" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#move)"/>
    </g>
    <g transform="translate(762 283)">
      <use href="#held-object"/>
      <g transform="translate(-52 49) rotate(-112)">
        <use href="#proximal-link"/>
        <g transform="translate(73 0) rotate(89.71)">
          <use href="#middle-link"/>
          <g transform="translate(71 0) rotate(43.40)">
            <use href="#distal-link"/>
            <use href="#fingertip" x="35"/>
            <use href="#finger-joint"/>
          </g>
          <use href="#finger-joint"/>
        </g>
        <use href="#finger-joint"/>
      </g>
      <circle cx="19" cy="-33" r="10" fill="none" stroke="#efbd71" stroke-width="1.5"/>
    </g>
    <path d="M305 281H359" fill="none" stroke="#a5d4c3" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M587 281H641" fill="none" stroke="#a5d4c3" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="198" y="357" text-anchor="middle" fill="#c1cfce" font-size="14">One finger lets go.</text>
    <text x="480" y="357" text-anchor="middle" fill="#c1cfce" font-size="14">It moves to a new location.</text>
    <text x="762" y="357" text-anchor="middle" fill="#c1cfce" font-size="14">It touches the object again.</text>
    <circle cx="259" cy="377" r="4" fill="#89c6b1"/>
    <text x="272" y="382" fill="#a5d4c3" font-size="14">The same two green fingers keep holding the object.</text>

    <path d="M248 394V416" fill="none" stroke="#a5d4c3" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="48" y="423" width="396" height="72" rx="12" fill="#223c45" stroke="#45605e"/>
    <text x="70" y="448" fill="#a5d4c3" font-size="13" letter-spacing="1">02 / SELECT A HAND GEOMETRY</text>
    <text x="70" y="477" fill="#fffefa" font-size="19">Use contact behavior to rank hands.</text>
    <path d="M458 459H498" fill="none" stroke="#a5d4c3" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="514" y="423" width="398" height="72" rx="12" fill="#223c45" stroke="#45605e"/>
    <text x="536" y="448" fill="#a5d4c3" font-size="13" letter-spacing="1">03 / EVALUATE LEARNING ON NEW SKILLS</text>
    <text x="536" y="477" fill="#fffefa" font-size="19">Keep the hand. Train a fresh controller.</text>
    <text x="48" y="524" fill="#c1cfce" font-size="13">Hypothesis: contact behavior may help predict future learning.</text>
    <text x="912" y="524" fill="#a5d4c3" font-size="11" text-anchor="end">CONCEPT SCHEMATIC</text>
  </g>
</svg>
