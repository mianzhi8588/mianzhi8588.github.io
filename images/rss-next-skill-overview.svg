<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Which hand will learn the next skill?</title>
  <desc id="desc">A conceptual study pipeline: observe support exchanges on familiar tasks, rank and fix hand geometries, then train fresh controllers on new skills. No experimental results are depicted.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#72b9a5" stroke-width="1.5"/></marker>
  </defs>
  <rect width="960" height="540" fill="#172831"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="59" fill="#a5d4c3" font-size="15" letter-spacing="3">DEXTEROUS MANIPULATION / RSS 2027</text>
    <text x="48" y="110" fill="#fffefa" font-size="34">Which hand will learn the next skill?</text>
    <text x="48" y="145" fill="#c1cfce" font-size="18">Can familiar contact behavior help us choose a hand?</text>
    <rect x="48" y="192" width="400" height="232" rx="16" fill="#223c45" stroke="#45605e"/>
    <text x="72" y="226" fill="#a5d4c3" font-size="14" letter-spacing="1.2">01 / OBSERVE FAMILIAR TASKS</text>
    <circle cx="185" cy="317" r="51" fill="#f3f1e9"/>
    <path d="M93 370 130 342M235 290 278 264" stroke="#a5d4c3" stroke-width="17" stroke-linecap="round"/>
    <circle cx="142" cy="347" r="12" fill="#72b9a5" stroke="#172831" stroke-width="3"/>
    <circle cx="228" cy="286" r="12" fill="#72b9a5" stroke="#172831" stroke-width="3"/>
    <circle cx="183" cy="263" r="12" fill="#223c45" stroke="#e8b870" stroke-width="3"/>
    <circle cx="223" cy="353" r="12" fill="#e8b870" stroke="#172831" stroke-width="3"/>
    <path d="M207 250 C284 251 285 321 248 347" fill="none" stroke="#e8b870" stroke-width="2.5" stroke-dasharray="5 5"/>
    <text x="300" y="303" fill="#e8b870" font-size="16">Release</text>
    <text x="300" y="328" fill="#e8b870" font-size="16">Reposition</text>
    <text x="300" y="353" fill="#e8b870" font-size="16">Recontact</text>
    <text x="72" y="399" fill="#c1cfce" font-size="16">Other fingers maintain support.</text>
    <path d="M465 307H507" stroke="#72b9a5" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="528" y="192" width="384" height="102" rx="16" fill="#223c45" stroke="#45605e"/>
    <text x="552" y="226" fill="#a5d4c3" font-size="14" letter-spacing="1.2">02 / SELECT A GEOMETRY</text>
    <text x="552" y="258" fill="#fffefa" font-size="20">Contact-informed design ranking</text>
    <path d="M719 305V325" stroke="#72b9a5" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="528" y="343" width="384" height="81" rx="16" fill="#223c45" stroke="#45605e"/>
    <text x="552" y="373" fill="#a5d4c3" font-size="14" letter-spacing="1.2">03 / TEST NEW SKILLS</text>
    <text x="552" y="403" fill="#fffefa" font-size="20">Fixed hand. Fresh controller.</text>
    <path d="M48 461H912" stroke="#45605e"/>
    <text x="48" y="495" fill="#c1cfce" font-size="16">Research hypothesis: contact behavior may help predict future learning.</text>
    <text x="912" y="520" fill="#a5d4c3" font-size="12" text-anchor="end">CONCEPT SCHEMATIC</text>
  </g>
</svg>
